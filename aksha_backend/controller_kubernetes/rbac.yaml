# RBAC for controller_kubernetes's ServiceAccount "controller-sa".
# Fixes: statefulsets.apps "deepstream-batch" is forbidden for
#        system:serviceaccount:default:controller-sa
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-cluster-rolebinding

subjects:
- kind: ServiceAccount
  name: controller-sa
  namespace: default

roleRef:
  kind: ClusterRole
  name: controller-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controller-cluster-role

rules:
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

- apiGroups: [""]
  resources:
    - pods
    - services
    - configmaps
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

# Read-only — needed for _gpu_node_is_healthy's node-condition check before
# creating a new batch (Ready / DiskPressure / MemoryPressure). Without this,
# that check fails closed to "can't confirm, proceed anyway" (fails open by
# design — see _gpu_node_is_healthy's docstring), so it's a safety
# improvement, not a hard dependency, but add this to actually get its benefit.
- apiGroups: [""]
  resources:
    - nodes
  verbs:
    - get
    - list
