<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slack Alert</title>
</head>
<body style="margin:0;padding:0;">
    <div style="font-family:sans-serif;background:#dddd;padding:49px 20px">
        <div style="max-width:535px;margin:0 auto;padding:38px;background:#fff; box-shadow: 26px 56px 43px #ddd;border-radius: 10px;">
        <table>
            <tr>
            <td> 
                <img src="logo.png" style="max-width:127px;position:relative;left:-7px;" alt="">
            </td>
            <td style="width:300px;"></td>
            <td> <img src="logo2.png" style="max-width:127px;" alt=""></td>
            </tr>
        </table>
        <p style="font-size:18px;padding-top:10px;">
             Dear Aksha User, <br><br>
            Please check with alert details. <br><br>
            <p style="margin-bottom: 9px;">My Alert</p>
            <span style="line-height:30px;"><strong>Camera :</strong> {{camera}}</span><br>
            {{Alert_Details}}
            <span style="line-height:30px;"><strong>Camera Images : </strong></span><br>
            <table>
            <tr>
                <td>
                    <img src="{{alert_image_path}}" alt="my alert" style="max-width:250px;">
                </td>
            </tr>
            </table>
        </p>
        </div>
    </div>
</body>
</html>
