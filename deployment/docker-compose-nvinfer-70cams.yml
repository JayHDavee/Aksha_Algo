  # ──────────────────────────────────────────────────────────────────────────
  # Downstream consumers — scaled for 70 cameras @ 3fps
  #
  # Worst-case : 210 msgs/sec (70 × 3fps, all frames pass motion gate)
  # Typical    :  ~63 msgs/sec (30% motion pass rate on static scenes)
  #
  # alert_identification : 30 replicas — matches KAFKA_NUM_PARTITIONS
  # post_processor       : 30 replicas — heavier (DB writes + image saves)
  # notification         :  7 replicas — fires only on confirmed alerts
  # ──────────────────────────────────────────────────────────────────────────

  alert_identification:
    image: dockerhubalgo/alert_identification:15062026-1
    networks:
      - aksha-net
    restart: always
    deploy:
      replicas: 30
      restart_policy:
        condition: on-failure
    depends_on:
      kafka_broker:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    environment:
      TZ: Asia/Kolkata
      CROWD_THRESHOLD: 6
      AKSHA_PATH: /Aksha
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:mongo@mongodb/Aksha?authSource=admin&tls=false
    volumes:
      - ./Aksha:/Aksha
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


  post_processor:
    image: dockerhubalgo/post_processor:15062026-1
    networks:
      - aksha-net
    restart: always
    deploy:
      replicas: 30
      restart_policy:
        condition: on-failure
    depends_on:
      kafka_broker:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: Asia/Kolkata
